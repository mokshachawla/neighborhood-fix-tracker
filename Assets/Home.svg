<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EA6A12"/>
      <stop offset="100%" stop-color="#0F7A82"/>
    </linearGradient>
  </defs>
  <rect width="900" height="560" fill="url(#bg)"/>

  <!-- Nav bar -->
  <rect width="900" height="64" fill="#ffffff"/>
  <rect width="900" height="64" fill="none" stroke="#f0e4d8" stroke-width="1"/>
  <circle cx="40" cy="32" r="16" fill="url(#brand)"/>
  <path d="M30 32 L36 32 L39 25 L43 40 L47 20 L50 32 L58 32" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="66" y="38" font-family="Space Grotesk, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">CivicPulse</text>
  <text x="620" y="37" font-family="Arial" font-size="14" fill="#4b5563">Report</text>
  <text x="700" y="37" font-family="Arial" font-size="14" fill="#4b5563">Track</text>
  <rect x="770" y="18" width="100" height="30" rx="8" fill="url(#brand)"/>
  <text x="787" y="38" font-family="Arial" font-size="13" fill="#ffffff">Sign In</text>

  <!-- Hero -->
  <text x="450" y="170" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="36" font-weight="700" fill="#1f2937">Report civic issues.</text>
  <text x="450" y="212" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="36" font-weight="700" fill="url(#brand)">Track real fixes.</text>
  <text x="450" y="250" text-anchor="middle" font-family="Arial" font-size="15" fill="#6b7280">Snap a photo, drop a pin, and watch your city respond — in real time.</text>

  <rect x="345" y="275" width="130" height="42" rx="10" fill="url(#brand)"/>
  <text x="410" y="301" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#ffffff">Report Now</text>
  <rect x="490" y="275" width="130" height="42" rx="10" fill="#ffffff" stroke="#0F7A82" stroke-width="1.5"/>
  <text x="555" y="301" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#0F7A82">View Map</text>

  <!-- Stat cards -->
  <g font-family="Space Grotesk, Arial, sans-serif">
    <rect x="90" y="360" width="220" height="110" rx="14" fill="#ffffff" stroke="#f0e4d8"/>
    <text x="200" y="410" text-anchor="middle" font-size="30" font-weight="700" fill="#EA6A12">12,480</text>
    <text x="200" y="435" text-anchor="middle" font-size="13" fill="#6b7280">Issues Reported</text>

    <rect x="340" y="360" width="220" height="110" rx="14" fill="#ffffff" stroke="#f0e4d8"/>
    <text x="450" y="410" text-anchor="middle" font-size="30" font-weight="700" fill="#0F7A82">9,102</text>
    <text x="450" y="435" text-anchor="middle" font-size="13" fill="#6b7280">Resolved</text>

    <rect x="590" y="360" width="220" height="110" rx="14" fill="#ffffff" stroke="#f0e4d8"/>
    <text x="700" y="410" text-anchor="middle" font-size="30" font-weight="700" fill="#1f2937">48hr</text>
    <text x="700" y="435" text-anchor="middle" font-size="13" fill="#6b7280">Avg. Response Time</text>
  </g>

  <text x="450" y="530" text-anchor="middle" font-family="Arial" font-size="12" fill="#9ca3af">CivicPulse — Landing Page Preview (redesigned theme)</text>
</svg>
